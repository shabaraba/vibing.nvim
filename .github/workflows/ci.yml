name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Lua
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.3

      - name: Setup Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable

      - name: Install plenary.nvim
        run: |
          mkdir -p ~/.local/share/nvim/site/pack/vendor/start
          git clone --depth 1 https://github.com/nvim-lua/plenary.nvim \
            ~/.local/share/nvim/site/pack/vendor/start/plenary.nvim

      - name: Run Lua syntax check
        run: npm run check

      # doc/*.txt is reachable by no other step: `check` compiles lua/ only, and the
      # prettier/eslint/markdownlint steps do not match `.txt`. This gates the document;
      # tests/help-check.test.mjs gates the checker itself, so neither replaces the other.
      - name: Verify Vim help files
        run: npm run check:doc

      # The exit code is the gate — do not parse the output. PlenaryBustedDirectory runs one
      # child Neovim per spec file and already fails the run on a failing assertion, an error,
      # a file that would not load, or a child that never finished; that is pinned by
      # tests/lua-test-exit-code.test.mjs. The previous version instead grepped for a single
      # `Failed : 0` line, and since one summary is printed per spec file, that line was always
      # there however many specs failed. timeout-minutes is only a backstop: the suite takes
      # seconds, and plenary already gives up on an individual spec after 50s.
      - name: Run Lua tests
        timeout-minutes: 10
        run: npm run test:lua

      - name: Run Node.js tests
        run: npm run test:node

      - name: Run validation suite
        run: npm run validate

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check file structure
        run: |
          echo "Checking required files..."
          test -f package.json && echo "OK: package.json exists"
          test -f LICENSE && echo "OK: LICENSE exists"
          test -f README.md && echo "OK: README.md exists"
          test -f CONTRIBUTING.md && echo "OK: CONTRIBUTING.md exists"
          test -d lua && echo "OK: lua/ directory exists"
          test -d bin && echo "OK: bin/ directory exists"
          test -f lua/vibing/init.lua && echo "OK: lua/vibing/init.lua exists"

      # Four files independently assert where the Claude Code plugin lives —
      # marketplace.json's `source`, build.sh's PLUGIN_SRC_DIR, install.lua's
      # get_mcp_dir(), and plugin.json's ${CLAUDE_PLUGIN_ROOT}-relative args.
      # They cannot share a constant (JSON / bash / Lua), and nothing else in CI
      # runs build.sh or installs the plugin, so a rename that updates only some
      # of them goes green here and surfaces as "MCP server directory not found"
      # on a user's next build. Resolve `source` and check the rest against it.
      - name: Check Claude Code plugin layout
        run: |
          SRC="$(node -e "
            const m = require('./.claude-plugin/marketplace.json');
            const p = m.plugins.find((p) => p.name === 'vibing-nvim');
            if (!p || typeof p.source !== 'string') throw new Error('no directory source for vibing-nvim');
            process.stdout.write(p.source.replace(/^\.\//, '').replace(/\/\$/, ''));
          ")"
          echo "marketplace.json source: $SRC"
          test -f "$SRC/.claude-plugin/plugin.json" && echo "OK: $SRC/.claude-plugin/plugin.json exists"
          test -d "$SRC/mcp-server" && echo "OK: $SRC/mcp-server/ exists"
          test -d "$SRC/agents" && echo "OK: $SRC/agents/ exists"
          test -d "$SRC/skills" && echo "OK: $SRC/skills/ exists"
          grep -q "PLUGIN_SRC_DIR=\"\${SCRIPT_DIR}/$SRC\"" build.sh \
            && echo "OK: build.sh PLUGIN_SRC_DIR matches"
          grep -q "\"/$SRC/mcp-server\"" lua/vibing/install.lua \
            && echo "OK: install.lua MCP dir matches"

  format-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check code formatting
        run: npm run format:check

      - name: Run ESLint
        run: npm run lint

      - name: Lint Markdown files
        run: npm run lint:md
        continue-on-error: true
